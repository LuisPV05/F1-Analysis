name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# El workflow solo necesita leer el código
permissions:
  contents: read

# Si subes un commit nuevo mientras corre uno anterior, cancela el viejo
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # FastF1 exige Python 3.10 o superior; se prueba el mínimo y el más reciente
        python-version: ["3.10", "3.14"]

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Ejecutar los tests
        run: python -m pytest -v